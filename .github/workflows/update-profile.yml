name: Update profile README

on:
  schedule:
    - cron: "0 */6 * * *" 
  workflow_dispatch:       
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update README
        env:
          THM_USER_ID: ${{ vars.THM_USER_ID }}
          THM_USERNAME: ${{ vars.THM_USERNAME }}
          CREDLY_USER: ${{ vars.CREDLY_USER }}
        run: python scripts/update_profile.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain README.md)" ]; then
            git add README.md
            git commit -m "chore: refresh THM + Credly stats"
            git push
          else
            echo "No changes."
          fi
