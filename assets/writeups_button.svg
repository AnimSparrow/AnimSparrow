<!-- Neon writeups card, matched to existing profile buttons. Wrap in a link:
     <p align="center"><a href="https://github.com/AnimSparrow/thm-writeups"><img src="assets/writeups_button.svg" width="520"></a></p> -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 76" width="520" height="76" role="img" aria-label="TryHackMe Writeups">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a0a4a"/><stop offset="55%" stop-color="#1f0838"/><stop offset="100%" stop-color="#3a0a5e"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF2A6D" stop-opacity="0.16"/><stop offset="45%" stop-color="#FF2A6D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00F0FF"/><stop offset="100%" stop-color="#00B8D4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>text{font-family:ui-monospace,'SF Mono',Menlo,'Cascadia Code',Consolas,monospace}</style>

  <rect x="1" y="1" width="518" height="74" rx="14" fill="url(#card)" stroke="#FF2A6D" stroke-opacity="0.55"/>
  <rect x="1" y="1" width="518" height="74" rx="14" fill="url(#sheen)"/>

  <rect x="20" y="22" width="32" height="32" rx="8" fill="url(#icon)"/>
  <text x="36" y="44" fill="#0d0420" font-size="16" font-weight="700" text-anchor="middle">&gt;_</text>

  <text x="70" y="34" fill="#00F0FF" font-size="16" font-weight="700" letter-spacing="1.2" filter="url(#glow)">TRYHACKME WRITEUPS</text>
  <text x="70" y="54" fill="#A479C4" font-size="12.5" font-weight="500">Walkthroughs &amp; detection notes from the rooms I solve</text>

  <text x="494" y="44" fill="#00F0FF" font-size="17" font-weight="700" text-anchor="end">&#8594;</text>
</svg>
